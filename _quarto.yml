project:
  type: default
  output-dir: _site

format:
  revealjs:
    theme:
      - custom.scss
    slide-number: c/t
    show-slide-number: all
    progress: true
    controls: true
    controls-layout: edges
    navigation-mode: linear
    transition: fade
    background-transition: fade
    center: false
    width: 1600
    height: 900
    margin: 0.075
    hash: true
    history: true
    preview-links: auto
    auto-stretch: false
    embed-resources: true
    html-math-method: mathml
    include-in-header:
      text: |
        <meta name="description" content="A presentation on the counting characterization of ordinary multiplication">

execute:
  freeze: auto
